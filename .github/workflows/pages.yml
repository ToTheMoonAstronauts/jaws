name: Deploy website to GitHub Pages
# Source: Settings > Pages > GitHub Actions

on:
  push:
    branches: [main]
    paths: ["website/**", "website-lt/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (EN at root with v2 as homepage, LT at /lt/)
        run: |
          mkdir _site
          cp -R website/. _site/
          mv _site/index.html _site/v1.html
          cp _site/index-v2.html _site/index.html
          mkdir _site/lt
          cp -R website-lt/. _site/lt/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
