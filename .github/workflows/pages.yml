name: Deploy website to GitHub Pages
# Source: Settings > Pages > GitHub Actions

on:
  push:
    branches: [main]
    paths: ["website/**", "tools/i18n/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder (EN at root, /go = copy of home, LT generated at /lt/)
        run: |
          mkdir _site
          cp -R website/. _site/
          cp _site/index.html _site/go.html
          python3 tools/i18n/build_lang.py lt website _site/lt --report
          python3 tools/i18n/build_lang.py de website _site/de --report --en-hreflang
          # cache-busting: every deploy makes browsers fetch the new script and styles
          V=${GITHUB_SHA::8}
          find _site -name '*.html' -exec sed -i "s#assets/site.js\"#assets/site.js?v=$V\"#g; s#assets/site.css\"#assets/site.css?v=$V\"#g" {} +
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
